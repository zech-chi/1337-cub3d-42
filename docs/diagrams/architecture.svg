<path d="M344.6534081807941,371.7263190753538 L335,377 L344.6534081807941,382.2736809246462" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M185,445 L185,470" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M185,470 L915,470" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M915,470 L915,445" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M920.2736809246462,454.6534081807941 L915,445 L909.7263190753538,454.6534081807941" fill="none" stroke="#222222" stroke-width="2"/>
<text x="442" y="491.0" fill="#666666" font-family="Arial, sans-serif" font-size="16">Next loop iteration</text>
<path d="M40,530 L1060,531 L1059,640 L41,639 Z" fill="#eeeeee" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<text x="60" y="558.0" fill="#222222" font-family="Arial, sans-serif" font-size="18">BONUS LAYER</text>
<text x="60" y="588.0" fill="#222222" font-family="Arial, sans-serif" font-size="18">Minimap / doors / weapon animation / mouse look / jump / lighting</text>
<text x="60" y="617.0" fill="#666666" font-family="Arial, sans-serif" font-size="17">Background music + action sounds run in separate threads (afplay).</text>
</svg>
