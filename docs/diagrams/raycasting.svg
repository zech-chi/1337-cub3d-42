<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">cub3D: raycasting and projection</title><desc id="desc">A fan of rays across a 60 degree field of view hits a wall on a two dimensional grid. Cosine-corrected distances keep the projected flat wall straight.</desc>
